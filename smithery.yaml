# Smithery configuration for DETRAN SP: Débitos e Restrições
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_detran_sp_debitos

name: detran_sp_debitos-mcp
displayName: "DETRAN SP: Débitos e Restrições"
description: >
  DETRAN SP: Débitos e Restrições, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/detran_sp_debitos-mcp
repository: https://github.com/mcp-dir/detran_sp_debitos-mcp

tags:
  - detran_sp_debitos
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_detran_sp_debitos

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_detran_sp_debitos/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
